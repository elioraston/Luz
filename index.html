<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ניהול סדר יום וחוגים</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #222222;
            --border-color: #d0d0d0;
            --danger-color: #e53935;
            --success-color: #2e7d32;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 8px;
            font-size: 15px;
        }

        /* Desktop Layout (Main Calendar on Left/Top, Sidebar on Right) */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 12px;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        header {
            background: var(--card-bg);
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        h1 { margin: 0; font-size: 1.25em; }
        h3 { margin: 0 0 6px 0; font-size: 1.05em; }

        .sidebar { display: flex; flex-direction: column; gap: 10px; }

        .card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }

        .sidebar-tabs {
            display: flex;
            gap: 2px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 8px;
        }

        .tab-btn {
            background: #eee;
            border: none;
            padding: 8px 4px;
            font-size: 0.85em;
            cursor: pointer;
            font-weight: bold;
            color: #555;
            border-radius: 5px 5px 0 0;
            flex: 1;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .form-group { margin-bottom: 8px; }

        label {
            display: block;
            font-size: 0.85em;
            margin-bottom: 2px;
            font-weight: bold;
        }

        input, select, textarea, button {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 0.95em;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 4px;
        }

        .btn-danger { background-color: var(--danger-color); }
        .btn-success { background-color: var(--success-color); }

        .manage-list {
            list-style: none;
            padding: 0;
            margin: 6px 0 0 0;
            max-height: 140px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
        }

        .manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85em;
        }

        .manage-actions { display: flex; gap: 3px; }
        .manage-actions button { padding: 2px 5px; font-size: 0.75em; margin: 0; width: auto; }

        .summary-dashboard {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            display: grid;
            grid-template-columns: 1fr 200px;
            gap: 10px;
            align-items: center;
        }

        .locations-summary-grid { display: flex; flex-wrap: wrap; gap: 6px; }

        .location-card {
            background: #f8f9fa;
            border-right: 4px solid var(--primary-color);
            padding: 6px 8px;
            border-radius: 4px;
            min-width: 130px;
            font-size: 0.88em;
        }

        .location-card-title {
            font-weight: bold;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .location-card-detail { font-size: 0.82em; color: #444; }

        .total-box {
            background: #eef7ee;
            border: 1px solid #c8e6c9;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .total-box-amount { font-size: 1.4em; font-weight: bold; color: #1b5e20; }

        .calendar-controls { display: flex; align-items: center; gap: 6px; font-weight: bold; }
        .calendar-controls select, .calendar-controls input { width: auto; padding: 6px; font-size: 0.95em; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            margin-top: 4px;
            width: 100%;
        }

        .day-header {
            text-align: center;
            font-weight: bold;
            padding: 6px 1px;
            background: #eef2f5;
            border-radius: 4px;
            font-size: 0.85em;
        }

        .day-cell {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            min-height: 85px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            word-wrap: break-word;
            overflow: hidden;
        }

        .day-number { font-weight: bold; font-size: 0.95em; margin-bottom: 2px; }

        .day-content { font-size: 0.82em; display: flex; flex-direction: column; gap: 3px; }

        /* Multiline tags so full text shows nicely */
        .tag {
            padding: 2px 4px;
            border-radius: 3px;
            color: #fff;
            font-weight: 500;
            font-size: 0.82em;
            white-space: normal;
            line-height: 1.2;
            word-break: break-word;
        }

        .tag-holiday {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            font-weight: bold;
        }

        .note-text {
            color: #555;
            font-style: italic;
            font-size: 0.8em;
            white-space: normal;
            line-height: 1.1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 16px;
            border-radius: 8px;
            width: 350px;
            max-width: 95%;
        }

        .recurrence-box {
            background: #f8f9fa;
            border: 1px dashed var(--border-color);
            padding: 6px;
            border-radius: 4px;
            margin-top: 4px;
            font-size: 0.8em;
        }

        .radio-group { display: flex; gap: 6px; margin-top: 2px; }
        .radio-group label { font-weight: normal; font-size: 0.82em; cursor: pointer; }
        .radio-group input { width: auto; }

        .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .legend-item { display: flex; align-items: center; gap: 3px; font-size: 0.8em; }
        .color-box { width: 10px; height: 10px; border-radius: 2px; }

        /* Mobile View Structure: Month Picker -> Calendar -> Summary -> Settings */
        @media (max-width: 850px) {
            .container {
                display: flex;
                flex-direction: column;
            }
            .summary-dashboard {
                grid-template-columns: 1fr;
            }
            .day-cell {
                min-height: 70px;
                padding: 2px;
            }
            .day-header {
                font-size: 0.8em;
                padding: 4px 0;
            }
            .tag {
                font-size: 0.78em;
                padding: 2px;
            }
            .day-number {
                font-size: 0.88em;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Main Area: Header -> Calendar -> Summary -->
    <div class="main-content">
        <header>
            <h1>ניהול סדר יום וחוגים</h1>
            <div class="calendar-controls">
                <label>חודש:</label>
                <select id="monthSelect" onchange="renderCalendar()"></select>
                <label>שנה:</label>
                <input type="number" id="yearSelect" value="2026" min="2024" max="2030" style="width: 70px;" onchange="renderCalendar()">
            </div>
        </header>

        <!-- Main Calendar Grid -->
        <div class="card">
            <div class="calendar-grid">
                <div class="day-header">א'</div><div class="day-header">ב'</div><div class="day-header">ג'</div>
                <div class="day-header">ד'</div><div class="day-header">ה'</div><div class="day-header">ו'</div><div class="day-header">ש'</div>
            </div>
            <div class="calendar-grid" id="calendarBody"></div>
        </div>

        <!-- Summary Dashboard -->
        <div class="summary-dashboard">
            <div>
                <h3>תמונת מצב ועלויות לפי מיקום לחודש</h3>
                <div id="locationsSummaryGrid" class="locations-summary-grid"></div>
            </div>
            <div class="total-box">
                <div>סה"כ לתשלום:</div>
                <div id="totalCost" class="total-box-amount">0 ₪</div>
            </div>
        </div>
    </div>

    <!-- Sidebar / Settings Area -->
    <div class="sidebar">
        <div class="card">
            <div class="sidebar-tabs">
                <button class="tab-btn active" id="btn-caregivers" onclick="openTab('tab-caregivers')">מטפלים</button>
                <button class="tab-btn" id="btn-activities" onclick="openTab('tab-activities')">חוגים</button>
                <button class="tab-btn" id="btn-pricing" onclick="openTab('tab-pricing')">תמחור</button>
                <button class="tab-btn" id="btn-sync" onclick="openTab('tab-sync')" style="color:#d32f2f;">העברה</button>
            </div>

            <div id="tab-caregivers" class="tab-panel active">
                <div style="display:flex; gap:4px;">
                    <input type="text" id="newCaregiverName" placeholder="שם המטפל/ת">
                    <button onclick="saveCaregiver()" style="width:auto; white-space:nowrap;">שמור</button>
                </div>
                <input type="hidden" id="editCaregiverId">
                <ul id="caregiverManageList" class="manage-list"></ul>
            </div>

            <div id="tab-activities" class="tab-panel">
                <form onsubmit="saveActivity(event)">
                    <input type="hidden" id="editActId">
                    <div class="form-group">
                        <label>שם החוג</label>
                        <input type="text" id="actName" required placeholder="חוג חיות">
                    </div>
                    <div class="form-group">
                        <label>מיקום החוג</label>
                        <input type="text" id="actLocation" required placeholder="Sweetnest">
                    </div>
                    <div class="form-group">
                        <label>סוג תמחור</label>
                        <select id="actPricingType" onchange="togglePricingInputs()">
                            <option value="monthly_hub">חיוב חודשי לפי כמות ימים</option>
                            <option value="fixed_single">חוג עצמאי (מחיר למפגש)</option>
                        </select>
                    </div>
                    <div class="form-group" id="singlePriceGroup" style="display:none;">
                        <label>מחיר למפגש (₪)</label>
                        <input type="number" id="actSinglePrice" value="0">
                    </div>
                    <button type="submit" id="submitActBtn">הוסף חוג</button>
                </form>
                <ul id="activityManageList" class="manage-list"></ul>
            </div>

            <div id="tab-pricing" class="tab-panel">
                <div class="form-group"><label>פעם בשבוע (₪):</label><input type="number" id="tier1" value="300" onchange="saveTiers()"></div>
                <div class="form-group"><label>פעמיים בשבוע (₪):</label><input type="number" id="tier2" value="500" onchange="saveTiers()"></div>
                <div class="form-group"><label>3 פעמים בשבוע (₪):</label><input type="number" id="tier3" value="700" onchange="saveTiers()"></div>
                <div class="form-group"><label>4 פעמים בשבוע (₪):</label><input type="number" id="tier4" value="850" onchange="saveTiers()"></div>
                <div class="form-group"><label>5 פעמים בשבוע (₪):</label><input type="number" id="tier5" value="1000" onchange="saveTiers()"></div>
            </div>

            <div id="tab-sync" class="tab-panel">
                <label>1. העתקה מהמחשב:</label>
                <button class="btn-success" onclick="exportData()">העתק קוד העברה</button>
                <hr style="margin:8px 0; border:0; border-top:1px solid #ddd;">
                <label>2. טעינה לטלפון:</label>
                <textarea id="importInput" rows="3" placeholder="הדבק קוד כאן..."></textarea>
                <button onclick="importData()">טען לטלפון</button>
            </div>
        </div>

        <div class="card">
            <label>מקרא מיקומים:</label><div id="locationLegend" class="legend"></div>
            <label style="margin-top:6px;">מקרא מטפלים:</label><div id="caregiverLegend" class="legend"></div>
        </div>
    </div>
</div>

<div class="modal" id="dayModal">
    <div class="modal-content">
        <h3 id="modalDateTitle">עריכת יום</h3>
        <div class="form-group">
            <label>דמות מטפלת:</label>
            <select id="modalCaregiver"><option value="">-- ללא --</option></select>
            <div class="recurrence-box">
                <strong>תדירות למטפל/ת:</strong>
                <div class="radio-group">
                    <label><input type="radio" name="caregiverRecurrence" value="single" checked> יום זה בלבד</label>
                    <label><input type="radio" name="caregiverRecurrence" value="monthly"> לכל ימי <span class="day-name-label"></span></label>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label>חוג:</label>
            <select id="modalActivity"><option value="">-- ללא --</option></select>
            <div class="recurrence-box">
                <strong>תדירות לחוג:</strong>
                <div class="radio-group">
                    <label><input type="radio" name="activityRecurrence" value="single" checked> יום זה בלבד</label>
                    <label><input type="radio" name="activityRecurrence" value="monthly"> לכל ימי <span class="day-name-label"></span></label>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label>הערות:</label>
            <textarea id="modalNotes" rows="2" placeholder="הערות ליום זה..."></textarea>
        </div>
        <div style="display:flex; gap:6px;">
            <button onclick="saveDayData()">שמור</button>
            <button onclick="closeModal()" style="background:#888;">ביטול</button>
        </div>
    </div>
</div>

<script>
    var jewishHolidaysMap = {
        "2025-03-13": "ערב פורים", "2025-03-14": "פורים", "2025-03-15": "שושן פורים",
        "2025-04-12": "ערב פסח", "2025-04-13": "פסח", "2025-04-14": "חול המועד", "2025-04-15": "חול המועד",
        "2025-04-16": "חול המועד", "2025-04-17": "חול המועד", "2025-04-18": "ערב חג", "2025-04-19": "שביעי של פסח",
        "2025-04-24": "יום השואה", "2025-04-29": "יום הזיכרון", "2025-04-30": "עצמאות", "2025-05-16": "ל\"ג בעומר",
        "2025-06-01": "ערב שבועות", "2025-06-02": "שבועות", "2025-09-22": "ערב ר\"ה", "2025-09-23": "ראש השנה א'",
        "2025-09-24": "ראש השנה ב'", "2025-09-25": "צום גדליה", "2025-10-01": "ערב יום כיפור", "2025-10-02": "יום כיפור",
        "2025-10-06": "ערב סוכות", "2025-10-07": "סוכות", "2025-10-08": "חוה\"מ", "2025-10-09": "חוה\"מ", "2025-10-10": "חוה\"מ",
        "2025-10-11": "חוה\"מ", "2025-10-12": "הושענא רבה", "2025-10-13": "שמחת תורה", "2025-12-15": "חנוכה",

        "2026-03-02": "ערב פורים", "2026-03-03": "פורים", "2026-03-04": "שושן פורים",
        "2026-04-01": "ערב פסח", "2026-04-02": "פסח", "2026-04-03": "חוה\"מ", "2026-04-04": "חוה\"מ",
        "2026-04-05": "חוה\"מ", "2026-04-06": "חוה\"מ", "2026-04-07": "ערב חג", "2026-04-08": "שביעי של פסח",
        "2026-04-14": "יום השואה", "2026-04-21": "יום הזיכרון", "2026-04-22": "עצמאות", "2026-05-05": "ל\"ג בעומר",
        "2026-05-21": "ערב שבועות", "2026-05-22": "שבועות", "2026-09-11": "ערב ר\"ה", "2026-09-12": "ראש השנה א'",
        "2026-09-13": "ראש השנה ב'", "2026-09-14": "צום גדליה", "2026-09-20": "ערב יום כיפור", "2026-09-21": "יום כיפור",
        "2026-09-25": "ערב סוכות", "2026-09-26": "סוכות", "2026-09-27": "חוה\"מ", "2026-09-28": "חוה\"מ",
        "2026-09-29": "חוה\"מ", "2026-09-30": "חוה\"מ", "2026-10-01": "הושענא רבה", "2026-10-02": "שמחת תורה", "2026-12-05": "חנוכה"
    };

    var monthsHebrew = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
    var daysHebrewName = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
    var palette = ['#e57373', '#ba68c8', '#64b5f6', '#4db6ac', '#81c784', '#ffd54f', '#ff8a65', '#a1887f', '#009688', '#e91e63', '#9c27b0'];

    var caregivers = JSON.parse(localStorage.getItem('caregivers') || '[{"id":"c1","name":"אמא"},{"id":"c2","name":"אבא"},{"id":"c3","name":"סבתא"},{"id":"c4","name":"מטפלת"}]');
    var activities = JSON.parse(localStorage.getItem('activities') || '[{"id":"1","name":"חוג חיות","location":"Sweetnest","pricingType":"monthly_hub","singlePrice":0}]');
    var monthlyData = JSON.parse(localStorage.getItem('monthlyData') || '{}');
    var hubTiers = JSON.parse(localStorage.getItem('hubTiers') || '{"1":300,"2":500,"3":700,"4":850,"5":1000}');

    var locationColorMap = {};
    var caregiverColorMap = {};
    var selectedDateKey = null;
    var selectedDayOfWeek = null;

    function getColorForLocation(loc) {
        if (!locationColorMap[loc]) {
            var keys = Object.keys(locationColorMap);
            locationColorMap[loc] = palette[keys.length % palette.length];
        }
        return locationColorMap[loc];
    }

    function getColorForCaregiver(cg) {
        if (!caregiverColorMap[cg]) {
            var keys = Object.keys(caregiverColorMap);
            caregiverColorMap[cg] = palette[(keys.length + 3) % palette.length];
        }
        return caregiverColorMap[cg];
    }

    function openTab(tabId) {
        var panels = document.querySelectorAll('.tab-panel');
        for(var i=0; i<panels.length; i++) panels[i].classList.remove('active');
        var btns = document.querySelectorAll('.tab-btn');
        for(var j=0; j<btns.length; j++) btns[j].classList.remove('active');

        document.getElementById(tabId).classList.add('active');
        document.getElementById('btn-' + tabId.replace('tab-', '')).classList.add('active');
    }

    function populateMonthSelect() {
        var mSelect = document.getElementById('monthSelect');
        mSelect.innerHTML = '';
        for (var i = 0; i < monthsHebrew.length; i++) {
            var opt = document.createElement('option');
            opt.value = i;
            opt.innerText = monthsHebrew[i];
            mSelect.appendChild(opt);
        }
        mSelect.value = new Date().getMonth();
    }

    function togglePricingInputs() {
        var type = document.getElementById('actPricingType').value;
        document.getElementById('singlePriceGroup').style.display = type === 'fixed_single' ? 'block' : 'none';
    }

    function saveCaregiver() {
        var name = document.getElementById('newCaregiverName').value.trim();
        var editId = document.getElementById('editCaregiverId').value;
        if (!name) return;

        if (editId) {
            var cg = caregivers.find(function(c){ return c.id === editId; });
            if (cg) cg.name = name;
        } else {
            caregivers.push({ id: 'c_' + Date.now(), name: name });
        }

        localStorage.setItem('caregivers', JSON.stringify(caregivers));
        document.getElementById('newCaregiverName').value = '';
        document.getElementById('editCaregiverId').value = '';
        updateUI();
    }

    function editCaregiver(id) {
        var cg = caregivers.find(function(c){ return c.id === id; });
        if (!cg) return;
        document.getElementById('newCaregiverName').value = cg.name;
        document.getElementById('editCaregiverId').value = cg.id;
    }

    function deleteCaregiver(id) {
        if (!confirm('האם למחוק?')) return;
        caregivers = caregivers.filter(function(c){ return c.id !== id; });
        localStorage.setItem('caregivers', JSON.stringify(caregivers));
        updateUI();
    }

    function saveActivity(e) {
        e.preventDefault();
        var editId = document.getElementById('editActId').value;
        var name = document.getElementById('actName').value.trim();
        var location = document.getElementById('actLocation').value.trim();
        var pricingType = document.getElementById('actPricingType').value;
        var singlePrice = parseFloat(document.getElementById('actSinglePrice').value) || 0;
        if (!name || !location) return;

        if (editId) {
            var act = activities.find(function(a){ return a.id === editId; });
            if (act) {
                act.name = name; act.location = location; act.pricingType = pricingType; act.singlePrice = singlePrice;
            }
        } else {
            activities.push({ id: Date.now().toString(), name: name, location: location, pricingType: pricingType, singlePrice: singlePrice });
        }

        localStorage.setItem('activities', JSON.stringify(activities));
        document.getElementById('actName').value = '';
        document.getElementById('actLocation').value = '';
        document.getElementById('editActId').value = '';
        updateUI();
    }

    function editActivity(id) {
        var act = activities.find(function(a){ return a.id === id; });
        if (!act) return;
        document.getElementById('editActId').value = act.id;
        document.getElementById('actName').value = act.name;
        document.getElementById('actLocation').value = act.location;
        document.getElementById('actPricingType').value = act.pricingType;
        document.getElementById('actSinglePrice').value = act.singlePrice;
        togglePricingInputs();
    }

    function deleteActivity(id) {
        if (!confirm('האם למחוק את החוג?')) return;
        activities = activities.filter(function(a){ return a.id !== id; });
        localStorage.setItem('activities', JSON.stringify(activities));
        updateUI();
    }

    function saveTiers() {
        hubTiers[1] = parseFloat(document.getElementById('tier1').value) || 0;
        hubTiers[2] = parseFloat(document.getElementById('tier2').value) || 0;
        hubTiers[3] = parseFloat(document.getElementById('tier3').value) || 0;
        hubTiers[4] = parseFloat(document.getElementById('tier4').value) || 0;
        hubTiers[5] = parseFloat(document.getElementById('tier5').value) || 0;
        localStorage.setItem('hubTiers', JSON.stringify(hubTiers));
        renderCalendar();
    }

    function renderCalendar() {
        var month = parseInt(document.getElementById('monthSelect').value);
        var year = parseInt(document.getElementById('yearSelect').value);
        var firstDay = new Date(year, month, 1).getDay();
        var daysInMonth = new Date(year, month + 1, 0).getDate();
        var grid = document.getElementById('calendarBody');
        grid.innerHTML = '';

        for (var i = 0; i < firstDay; i++) {
            var emptyCell = document.createElement('div');
            emptyCell.style.background = 'transparent';
            grid.appendChild(emptyCell);
        }

        for (var day = 1; day <= daysInMonth; day++) {
            (function(d) {
                var dateKey = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                var dayData = monthlyData[dateKey] || {};
                var cell = document.createElement('div');
                cell.className = 'day-cell';
                var dateObj = new Date(year, month, d);
                cell.onclick = function() { openModal(dateKey, d, dateObj.getDay()); };

                var html = '<div class="day-number">' + d + '</div><div class="day-content">';
                if (jewishHolidaysMap[dateKey]) html += '<div class="tag tag-holiday">🍷 ' + jewishHolidaysMap[dateKey] + '</div>';
                
                if (dayData.caregiver) {
                    var cgColor = getColorForCaregiver(dayData.caregiver);
                    html += '<div class="tag" style="background-color:' + cgColor + '">👤 ' + dayData.caregiver + '</div>';
                }

                if (dayData.activityId) {
                    var act = activities.find(function(a){ return a.id === dayData.activityId; });
                    if (act) {
                        var locColor = getColorForLocation(act.location);
                        html += '<div class="tag" style="background-color:' + locColor + '">🤸 ' + act.name + ' (' + act.location + ')</div>';
                    }
                }

                if (dayData.notes) {
                    html += '<div class="note-text" title="' + dayData.notes + '">' + dayData.notes + '</div>';
                }

                html += '</div>';
                cell.innerHTML = html;
                grid.appendChild(cell);
            })(day);
        }

        calculateSummary(year, month);
        renderLegends();
    }

    function openModal(dateKey, dayNum, dayOfWeek) {
        selectedDateKey = dateKey;
        selectedDayOfWeek = dayOfWeek;
        var monthName = monthsHebrew[parseInt(document.getElementById('monthSelect').value)];
        document.getElementById('modalDateTitle').innerText = 'עריכת יום ' + dayNum + ' ב' + monthName;
        
        var dayLabels = document.querySelectorAll('.day-name-label');
        for(var i=0; i<dayLabels.length; i++) dayLabels[i].innerText = daysHebrewName[dayOfWeek];

        var data = monthlyData[dateKey] || {};
        document.getElementById('modalCaregiver').value = data.caregiver || '';
        document.getElementById('modalActivity').value = data.activityId || '';
        document.getElementById('modalNotes').value = data.notes || '';

        document.getElementById('dayModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('dayModal').style.display = 'none'; }

    function saveDayData() {
        if (!selectedDateKey) return;
        var cg = document.getElementById('modalCaregiver').value;
        var act = document.getElementById('modalActivity').value;
        var notes = document.getElementById('modalNotes').value.trim();

        var cgRec = document.querySelector('input[name="caregiverRecurrence"]:checked').value;
        var actRec = document.querySelector('input[name="activityRecurrence"]:checked').value;

        var year = parseInt(document.getElementById('yearSelect').value);
        var month = parseInt(document.getElementById('monthSelect').value);
        var daysInMonth = new Date(year, month + 1, 0).getDate();
        var prefix = year + '-' + String(month + 1).padStart(2, '0');

        if (cgRec === 'single' && actRec === 'single') {
            updateRecord(selectedDateKey, cg, act, notes);
        } else {
            for (var d = 1; d <= daysInMonth; d++) {
                var dObj = new Date(year, month, d);
                var dKey = prefix + '-' + String(d).padStart(2, '0');

                if (dObj.getDay() === selectedDayOfWeek) {
                    var dayCg = (cgRec === 'monthly') ? cg : (monthlyData[dKey]?.caregiver || '');
                    var dayAct = (actRec === 'monthly') ? act : (monthlyData[dKey]?.activityId || '');
                    var dayN = (dKey === selectedDateKey) ? notes : (monthlyData[dKey]?.notes || '');
                    updateRecord(dKey, dayCg, dayAct, dayN);
                } else if (dKey === selectedDateKey) {
                    var dayCg = (cgRec === 'single') ? cg : (monthlyData[dKey]?.caregiver || '');
                    var dayAct = (actRec === 'single') ? act : (monthlyData[dKey]?.activityId || '');
                    updateRecord(dKey, dayCg, dayAct, notes);
                }
            }
        }

        localStorage.setItem('monthlyData', JSON.stringify(monthlyData));
        closeModal();
        renderCalendar();
    }

    function updateRecord(key, cg, act, notes) {
        if (!cg && !act && !notes) delete monthlyData[key];
        else monthlyData[key] = { caregiver: cg, activityId: act, notes: notes };
    }

    function calculateSummary(year, month) {
        var prefix = year + '-' + String(month + 1).padStart(2, '0');
        var locs = {};
        var total = 0;

        Object.keys(monthlyData).forEach(function(dKey) {
            if (dKey.startsWith(prefix)) {
                var entry = monthlyData[dKey];
                if (entry.activityId) {
                    var act = activities.find(function(a){ return a.id === entry.activityId; });
                    if (act) {
                        var loc = act.location;
                        if (!locs[loc]) locs[loc] = { hubDays: new Set(), fixedCost: 0, acts: {} };
                        locs[loc].acts[act.name] = (locs[loc].acts[act.name] || 0) + 1;
                        if (act.pricingType === 'monthly_hub') locs[loc].hubDays.add(new Date(dKey).getDay());
                        else if (act.pricingType === 'fixed_single') locs[loc].fixedCost += act.singlePrice;
                    }
                }
            }
        });

        var grid = document.getElementById('locationsSummaryGrid');
        grid.innerHTML = '';
        var locNames = Object.keys(locs);

        if (locNames.length === 0) {
            grid.innerHTML = '<span style="color:#777; font-size:0.85em;">אין חוגים משובצים בחודש זה.</span>';
        }

        locNames.forEach(function(loc) {
            var data = locs[loc];
            var count = data.hubDays.size;
            var hubCost = hubTiers[count] || (count >= 5 ? hubTiers[5] : 0) || 0;
            var sum = hubCost + data.fixedCost;
            total += sum;
            var color = getColorForLocation(loc);

            var actStr = Object.keys(data.acts).map(function(n){ return n + ' (' + data.acts[n] + ')'; }).join(', ');

            var card = document.createElement('div');
            card.className = 'location-card';
            card.style.borderRightColor = color;
            card.innerHTML = '<div class="location-card-title"><span class="color-box" style="background:' + color + '"></span><span>' + loc + '</span></div>' +
                             '<div class="location-card-detail">' + actStr + '</div>' +
                             '<div style="font-weight:bold; margin-top:2px; color:#2e7d32;">עלות: ' + sum + ' ₪</div>';
            grid.appendChild(card);
        });

        document.getElementById('totalCost').innerText = total + ' ₪';
    }

    function renderLegends() {
        var locLeg = document.getElementById('locationLegend');
        locLeg.innerHTML = '';
        Object.keys(locationColorMap).forEach(function(loc){
            var div = document.createElement('div');
            div.className = 'legend-item';
            div.innerHTML = '<div class="color-box" style="background:' + locationColorMap[loc] + '"></div><span>' + loc + '</span>';
            locLeg.appendChild(div);
        });

        var cgLeg = document.getElementById('caregiverLegend');
        cgLeg.innerHTML = '';
        Object.keys(caregiverColorMap).forEach(function(cg){
            var div = document.createElement('div');
            div.className = 'legend-item';
            div.innerHTML = '<div class="color-box" style="background:' + caregiverColorMap[cg] + '"></div><span>' + cg + '</span>';
            cgLeg.appendChild(div);
        });
    }

    function exportData() {
        var dataObj = { caregivers: caregivers, activities: activities, monthlyData: monthlyData, hubTiers: hubTiers };
        var jsonStr = JSON.stringify(dataObj);
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(jsonStr).then(function() {
                alert('קוד ההעברה הועתק! שלחי אותו ב-WhatsApp והדביקי בטלפון.');
            }).catch(function() {
                prompt("העתקי את הטקסט:", jsonStr);
            });
        } else {
            prompt("העתקי את הטקסט:", jsonStr);
        }
    }

    function importData() {
        var rawInput = document.getElementById('importInput').value;
        if (!rawInput || !rawInput.trim()) {
            alert('אנא הדבקי את קוד ההעברה בתיבה.');
            return;
        }

        var cleanTxt = rawInput.trim().replace(/[\r\n\t]/g, '');

        try {
            var parsedObj = JSON.parse(cleanTxt);
            if (parsedObj && typeof parsedObj === 'object') {
                if (parsedObj.caregivers) localStorage.setItem('caregivers', JSON.stringify(parsedObj.caregivers));
                if (parsedObj.activities) localStorage.setItem('activities', JSON.stringify(parsedObj.activities));
                if (parsedObj.monthlyData) localStorage.setItem('monthlyData', JSON.stringify(parsedObj.monthlyData));
                if (parsedObj.hubTiers) localStorage.setItem('hubTiers', JSON.stringify(parsedObj.hubTiers));

                alert('הנתונים נטענו בהצלחה!');
                location.reload();
            } else {
                alert('קוד לא תקין.');
            }
        } catch(e) {
            alert('שגיאה בפענוח הקוד. ודאי שהעתקת את כל הקוד ללא השמטה.');
        }
    }

    function updateUI() {
        var cgList = document.getElementById('caregiverManageList');
        cgList.innerHTML = '';
        caregivers.forEach(function(c){
            var li = document.createElement('li');
            li.className = 'manage-item';
            li.innerHTML = '<span>' + c.name + '</span><div class="manage-actions"><button onclick="editCaregiver(\'' + c.id + '\')">ערוך</button><button class="btn-danger" onclick="deleteCaregiver(\'' + c.id + '\')">מחק</button></div>';
            cgList.appendChild(li);
        });

        var actList = document.getElementById('activityManageList');
        actList.innerHTML = '';
        activities.forEach(function(a){
            var li = document.createElement('li');
            li.className = 'manage-item';
            li.innerHTML = '<span><strong>' + a.name + '</strong> (' + a.location + ')</span><div class="manage-actions"><button onclick="editActivity(\'' + a.id + '\')">ערוך</button><button class="btn-danger" onclick="deleteActivity(\'' + a.id + '\')">מחק</button></div>';
            actList.appendChild(li);
        });

        var actSelect = document.getElementById('modalActivity');
        actSelect.innerHTML = '<option value="">-- ללא חוג --</option>';
        activities.forEach(function(a){
            var opt = document.createElement('option');
            opt.value = a.id;
            opt.innerText = a.name + ' (' + a.location + ')';
            actSelect.appendChild(opt);
        });

        var cgSelect = document.getElementById('modalCaregiver');
        cgSelect.innerHTML = '<option value="">-- ללא דמות מטפלת --</option>';
        caregivers.forEach(function(c){
            var opt = document.createElement('option');
            opt.value = c.name;
            opt.innerText = c.name;
            cgSelect.appendChild(opt);
        });

        renderCalendar();
    }

    populateMonthSelect();
    document.getElementById('tier1').value = hubTiers[1] || 300;
    document.getElementById('tier2').value = hubTiers[2] || 500;
    document.getElementById('tier3').value = hubTiers[3] || 700;
    document.getElementById('tier4').value = hubTiers[4] || 850;
    document.getElementById('tier5').value = hubTiers[5] || 1000;
    updateUI();
</script>
</body>
</html>
